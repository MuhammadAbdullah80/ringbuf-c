name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        cc: [gcc, clang]
        std: [c99, c11]
    steps:
      - uses: actions/checkout@v4
      - name: Build and run
        run: |
          ${{ matrix.cc }} --version
          make test CC=${{ matrix.cc }} \
            CFLAGS="-std=${{ matrix.std }} -Wall -Wextra -Werror -pedantic -O2"

  cmake:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure, build and test
        run: |
          cmake -S . -B build -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          ctest --test-dir build --output-on-failure
      - name: Install into a staging prefix
        run: cmake --install build --prefix "$PWD/stage"
      - name: Consume the installed package from a separate project
        run: |
          mkdir -p consumer
          cat > consumer/CMakeLists.txt <<'EOF'
          cmake_minimum_required(VERSION 3.14)
          project(consumer LANGUAGES C)
          find_package(ringbuf 0.1 REQUIRED)
          add_executable(consumer main.c)
          target_link_libraries(consumer PRIVATE ringbuf::ringbuf)
          EOF
          cat > consumer/main.c <<'EOF'
          #include <ringbuf.h>
          #include <stdio.h>
          int main(void) {
              unsigned char storage[8];
              ringbuf rb;
              if (ringbuf_init(&rb, storage, sizeof storage) != 0) return 1;
              if (ringbuf_write(&rb, "hello", 5) != 5) return 1;
              printf("ok, %zu bytes buffered", ringbuf_size(&rb));
              putchar(10);
              return 0;
          }
          EOF
          cmake -S consumer -B consumer/build -DCMAKE_PREFIX_PATH="$PWD/stage"
          cmake --build consumer/build
          ./consumer/build/consumer

  sanitizers:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Address and undefined-behaviour sanitizers
        run: |
          make clean
          make test CC=clang \
            CFLAGS="-std=c11 -Wall -Wextra -Werror -pedantic -g -fsanitize=address,undefined -fno-omit-frame-pointer"

  valgrind:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install valgrind
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y valgrind
      - name: Run under valgrind
        run: |
          make clean
          make CFLAGS="-std=c99 -Wall -Wextra -Werror -pedantic -g -O1"
          valgrind --error-exitcode=1 --leak-check=full --track-origins=yes ./ringbuf-test
